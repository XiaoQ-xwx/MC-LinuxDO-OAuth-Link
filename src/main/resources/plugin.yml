name: OAuthLink
description: Minecraft LinuxDO OAuth Account Link
version: '${version}'

main: org.linuxdo.oauthlink.OAuthLink
# 声明最低支持的 API 版本。设为 1.16 表示插件兼容 1.16.5 ~ 1.21.x；
# 在高于 1.16 的服务器上加载时，Spigot/Paper 可能输出 "outdated API" 软警告，但不阻断加载。
api-version: '1.16'

authors: [ XiaoQ ]
website: https://linux.do/u/xiao_q/summary

commands:
  linkld:
    description: Start or complete LinuxDO OAuth account linking
    usage: /<command> [code|unlink]
    permission: oauthlink.command.link
  oauthlink:
    description: OAuthLink administration
    usage: /<command> reload
    aliases: [olink]
    permission: oauthlink.admin

permissions:
  oauthlink.command.link:
    description: Allows linking Minecraft account with LinuxDO OAuth
    default: true
  oauthlink.admin:
    description: Allows OAuthLink administrative commands
    default: op
