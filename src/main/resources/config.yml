# ============================================================================
# MC-LinuxDO-OAuth-Link — 配置文件
# ============================================================================
# OAuth 应用注册: https://connect.linux.do/
# 修改配置后使用 /oauthlink reload 重载生效
# ============================================================================

# ── OAuth2 认证 ────────────────────────────────────────────────────────────
oauth:
  # [必填] LinuxDO Connect 应用 ID
  client-id: ""
  # [必填] LinuxDO Connect 应用密钥（敏感信息，勿泄露）
  client-secret: ""
  # LinuxDO OAuth2 授权端点
  authorization-url: "https://connect.linux.do/oauth2/authorize"
  # Token 交换端点
  token-url: "https://connect.linux.do/oauth2/token"
  # 用户信息 API 端点
  user-info-url: "https://connect.linux.do/api/user"
  # OAuth 回调地址，必须与 LinuxDO Connect 后台注册的一致
  # 本地开发:   http://127.0.0.1:2790/oauth/callback  (host=127.0.0.1)
  # 局域网:     http://192.168.x.x:2790/oauth/callback  (host=0.0.0.0)
  # 公网 IP:    http://公网IP:2790/oauth/callback       (host=0.0.0.0)
  # 公网域名:   https://你的域名/oauth/callback          (host=0.0.0.0, 推荐反代)
  redirect-uri: "http://127.0.0.1:2790/oauth/callback"

# ── 回调 HTTP 服务器 ──────────────────────────────────────────────────────
callback:
  # 监听地址: 127.0.0.1=仅本机, 0.0.0.0=所有网卡
  host: "127.0.0.1"
  # 监听端口 (1-65535)
  port: 2790
  # 回调路径，需与 redirect-uri 路径段一致
  path: "/oauth/callback"

# ── 安全设置 ──────────────────────────────────────────────────────────────
security:
  # OAuth state 参数有效期，超时需重新发起授权（秒，最低 30）
  state-ttl-seconds: 300
  # 手动验证码有效期（秒，最低 30）
  link-code-ttl-seconds: 300
  # Token 过期时间容忍偏差，用于容忍服务器时钟不同步（秒）
  token-expiry-skew-seconds: 60

# ── 持久化存储 ────────────────────────────────────────────────────────────
storage:
  # 绑定数据存储文件名（位于 plugins/OAuthLink/ 目录下）
  file: "data.yml"

# ── 聊天消息（支持颜色代码 &） ──────────────────────────────────────────────
# 修改后使用 /oauthlink reload 即可生效，无需重启服务器
messages:
  # 发起授权时 — 引导玩家点击链接
  oauth-start-title: "⚡ &lLinux.DO 账号绑定&r &7──────────────────"
  oauth-start-click-hint: "&7点击 "
  oauth-start-click-button: "&b&l[此处]"
  oauth-start-click-suffix: "&7 验证你的 LinuxDO 账号"
  oauth-start-auto-hint: "&7授权完成后将自动绑定；若自动绑定失败，请使用浏览器页面上显示的 &b/linkld <验证码>&7 完成手动绑定"
  oauth-start-retry-hint: "&7或随时使用 &b/linkld&7 重新发起授权"
  # 自动绑定失败时 — 通知玩家去网页取验证码
  auto-bind-failed-title: "&c❌ 自动绑定失败"
  auto-bind-failed-code-hint: "&7请在浏览器页面上获取验证码，使用 &b/linkld <验证码>&7 完成手动绑定"
  auto-bind-failed-retry-hint: "&7或使用 &b/linkld&7 重新发起授权"
