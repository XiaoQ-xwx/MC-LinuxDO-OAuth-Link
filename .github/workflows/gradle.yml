# Build & Test: Java 17 + Gradle (shadowJar for Spigot/Paper)
# On tag push (v*): automatically creates a GitHub Release with the built JAR.
#
# Caching: gradle/actions/setup-gradle handles Gradle wrapper + dependency cache.
# Artifacts: JAR uploaded on every push/PR; test reports uploaded on failure.

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC"

jobs:
  # ── Build & Test ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run Tests
      run: ./gradlew test

    - name: Upload Test Reports (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: build/reports/tests/
        retention-days: 7

    - name: Build shadowJar
      run: ./gradlew build

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MC-LinuxDO-OAuth-Link
        path: build/libs/*.jar
        retention-days: 30

  # ── GitHub Release (tag push only) ────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Extract tag version
      id: version
      run: |
        TAG=${GITHUB_REF#refs/tags/v}
        echo "version=$TAG" >> "$GITHUB_OUTPUT"

    - name: Build with release version
      run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ steps.version.outputs.version }}
        files: build/libs/*.jar
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency Graph (Dependabot) ─────────────────────────────
  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
